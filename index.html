<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
	<title>Document</title>
</head>
<body>
    <button class="abrirTemas" id="abrirTemas">Abrir painel de temas</button>
     <div class="painelTemas escondido" id="painelTemas">
        
        <p style="font-size: 16px; margin-bottom: 8px;">escolha a cor do seu app</p>
        <button class="btnTema" stlyle="background-color=#d000ff; color:#fff;" onclick="mudarTema('#d000ff')">Roxo padrao</button>
        <button class="btnTema" style="background-color: #0f6; color: #000;" onclick="mudarTema('#0f6')">Verde matrix</button>
        <button class="btnTema" style="background-color: #00d2ff; color: #000;" onclick="mudarTema('#00d2ff')">Azul cybernetico</button>
        <button class="btnTema" style="background-color: #ff0055; color: #fff;" onclick="mudarTema('#ff0055')">Rosa choque</button>
        <button class="btnTema" style="background-color: #ff0090; color: #fff;" onclick="mudarTema('#ff0090')">Magenta neon</button>
        <button class="btnTema" style="background-color: #39ff14; color: #000;" onclick="mudarTema('#39ff14')">Verde neon</button>
        <button class="btnTema" style="background-color: #2323ff; color: #000;" onclick="mudarTema('#2323ff')">Azul neon</button>
        <button class="btnTema" style="background-color: #8a00c4; color: #fff;" onclick="mudarTema('#8a00c4')">Roxo neon</button>   
    </div>
    <div id="registro" class="registro">
    <form>
        <label for="create_user" id="label_for_create_user">Crie seu usuario/email</label>
        <input type="text" id="create_user" placeholder="Ex: seu.email123@gmail.com">
        <label for="create_pswrd" id="label_for_create_pswrd">Crie sua senha</label>
        <input type="password" id="create_pswrd" placeholder="Ex: ********">
        <button id="btn_cadastro">Criar</button>
    </form>
    </div>
    <div id="login" class="login escondido">
        <form>
            <label for="log_ser" id="label_for_log_user">Insira seu usuario/email</label>
            <input type="text"  id="log_user" placeholder="Ex: seu.email123@gmai.com">
            <label for="log_pswrd" id="label_for_log_pswrd">Insira sua senha</label>
            <input type="password" id="log_pswrd" placeholder="Ex: ********">
            <button id="btn_login">Entrar</button>
        </form>
    </div>
    <div id="display" class="display escondido">
        <main id="sexta">
            <section class="blocoNotas">
    <div class="cartao">
        <h2>Bloco de Notas Rápidas 📝</h2>
        <!-- Caixa de texto para digitar a nota -->
        <textarea id="textoNota" placeholder="Escreva uma ideia ou lembrete rápido..."></textarea>
        <button id="btnCriarNota">Criar Nota Adesiva</button>
        <div id="btnTogglePasta" class="pastaCabecalho">
            📁 Minhas Notas Salvas (Clique para Abrir/Fechar)
        </div>
        
        <!-- O container onde as notas criadas vão aparecer empilhadas ou lado a lado -->
        <div id="containerNotas" class="containerNotas escondido"></div>
    </div>
</section>
</main>
<button id="btn_sair">Encerrar sessao</button>
    </div>
	<footer>
	</footer>
    <script src="script.js"></script>
</body>
</html>
